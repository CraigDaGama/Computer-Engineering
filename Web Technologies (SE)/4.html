<!DOCTYPE html>
<html lang="en">
    <body>
        <script>
            function f1() 
            {
                var fname="";
                var lname="";

                fname = document.getElementById("fn").value;
                lname = document.getElementById("ln").value;

                if(fname=="")
                {
                    alert("First name field cant be empty")
                }

                if(lname=="")
                {
                    alert("Last name field cant be empty")
                }

                else
                {
                    document.write("<br>first name entered is: " +fname);
                    document.write("<br>last name entered is: " +lname);
                }  
            
                var x = document.getElementById("ad");
                var y = x.options[x.selectedIndex].value;

                if(y=="")
                {
                    alert("Address not selected ");
                    return false;
                }
                else
                {
                    alert("Address selected is: "+ y);
                    return true;
                }            
            }
        </script>
        <form onsubmit="return f1()" >
            <label>First Name</label>
            <input type="text" id="fn"><br>
            <label>Last Name</label>
            <input type="text" id="ln"><br>
            <br>
            <label>select your city</label>
            <select id="ad">
                <option value=""></option>
                <option value="Mapusa">Mapusa</option>
                <option value="Panjim">Panjim</option>
                <option value="Vasco">Vasco</option>
            </select>
            <br>
            <input type="submit"></input>       
        </form> 
    </body>
</html>
